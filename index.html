<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MixMaat VJ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
:root{--o:#ff7a1a;--w:#fff;--k:#000}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#brand{position:fixed;top:12px;left:12px;z-index:3;width:52px;height:52px;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 70%);display:flex;flex-direction:column;gap:8px;transition:opacity .3s}
#ui.hidden{opacity:0;pointer-events:none}
#showBtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;display:none}
button,select{font-family:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;background:#000;color:#fff;border:2px solid #fff;border-radius:999px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--o)}
button.on,button.primary{background:var(--o);border-color:var(--o);color:#000}
select{padding-right:14px;color:#fff}
label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:flex;flex-direction:column;gap:4px;color:#bbb}
input[type=range]{width:110px;accent-color:var(--o)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#modes{display:flex;gap:6px;flex-wrap:wrap}
#modes button{padding:6px 10px;font-size:11px}
#start{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow-y:auto}
#start.gone{display:none}
#start img.logo{width:140px;height:140px;object-fit:contain}
h1{font-size:30px;font-weight:900;letter-spacing:.02em}
h1 span{color:var(--o)}
#start p{max-width:380px;color:#aaa;line-height:1.5;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#err{color:var(--o);max-width:380px;min-height:1em;font-size:13px}
</style>
</head>

const IMGS = {};
for (const k in IMG_SRC) { IMGS[k] = new Image(); IMGS[k].src = IMG_SRC[k]; }

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
}
addEventListener('resize', resize); resize();

const S = { mode:0, auto:false, hue:25, sens:1, trail:0.5, demo:false, occ:'Feest', rain:true };
const NAMES = ['Spectrum','Cirkel','Golfvorm','Deeltjes','Tunnel'];
let analyser = null, started = false, running = false;
let freq = new Uint8Array(256), wave = new Uint8Array(512);
let beatLevel = 0, hist = [], lastBeat = 0, autoTimer = 0, parts = [], floats = [], phase = 0;

function initOcc(){
  for (const id of ['occ','occStart']) {
    const sel = document.getElementById(id);
    Object.keys(OCC).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
    sel.value = S.occ;
  }
}
function setOcc(k){
  S.occ = k;
  document.getElementById('occ').value = k;
  document.getElementById('occStart').value = k;
}
initOcc();

function buildModeButtons(){
  if (document.getElementById('m0')) return;
  const box = document.getElementById('modes');
  NAMES.forEach((n,i) => {
    const b = document.createElement('button');
    b.textContent = (i+1) + '. ' + n;
    b.id = 'm' + i;
    b.onclick = () => setMode(i);
    box.appendChild(b);
  });
  updateButtons();
}
function setMode(i){ S.mode = i; autoTimer = performance.now(); updateButtons(); }
function updateButtons(){
  NAMES.forEach((_,i) => { const b = document.getElementById('m'+i); if (b) b.classList.toggle('on', i === S.mode); });
  document.getElementById('autoBtn').classList.toggle('on', S.auto);
  document.getElementById('rainBtn').classList.toggle('on', S.rain);
}
function toggleAuto(){ S.auto = !S.auto; autoTimer = performance.now(); updateButtons(); }
function toggleRain(){ S.rain = !S.rain; updateButtons(); }
function toggleUI(){
  const ui = document.getElementById('ui'), show = document.getElementById('showBtn');
  const hidden = ui.classList.toggle('hidden');
  show.style.display = hidden ? 'block' : 'none';
}
function showStart(){ document.getElementById('start').classList.remove('gone'); }
function fs(){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = parseInt(e.key);
  if (k >= 1 && k <= NAMES.length) setMode(k-1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  if (e.key === 'h' || e.key === 'H') toggleUI();
  if (e.key === 'e' || e.key === 'E') toggleRain();
  if (e.key === 'f' || e.key === 'F') fs();
  if (e.key === 'Escape') showStart();
});

// Tik op het scherm: grote sticker of emoji plus een kleine explosie
addEventListener('pointerdown', e => {
  if (document.getElementById('start').classList.contains('gone') === false) return;
  if (e.target.closest('#ui,#showBtn,button,select,input')) return;
  spawnBurst(e.clientX, e.clientY);
});

function pickItem(){
  const o = OCC[S.occ];
  if (o.img.length && Math.random() < 0.4) {
    const k = o.img[Math.floor(Math.random() * o.img.length)];
    return { img: IMGS[k], imgKey: k };
  }
  return { t: o.emo[Math.floor(Math.random() * o.emo.length)] };
}
function makeItem(x, y, vx, vy, g, d, rot){
  return Object.assign({ x, y, vx, vy, g, d, rot, life:1 }, pickItem());
}
function spawnBurst(x, y){
  floats.push(makeItem(x, y, 0, -2, 0, 56, 0));
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
    floats.push(makeItem(x, y, Math.cos(a)*sp, Math.sin(a)*sp - 2, 0.18, 16 + Math.random()*10, (Math.random()-.5)*1.5));
  }
  if (floats.length > 80) floats.splice(0, floats.length - 80);
}
// Bij elke beat een kleine sticker die omhoog zweeft
function rainItem(){
  if (!S.rain || floats.length > 40) return;
  floats.push(makeItem(Math.random()*W, H + 20, (Math.random()-.5)*1.2, -(3 + Math.random()*3), 0, 18 + Math.random()*12, (Math.random()-.5)*0.6));
}

// Sprites: elk emoticon/sticker wordt één keer getekend in een ronde badge en daarna hergebruikt
const SPRITES = new Map();
const SPR = 96;
function ring(g){
  g.beginPath(); g.arc(SPR/2, SPR/2, SPR/2 - 4, 0, Math.PI*2);
  g.lineWidth = 6; g.strokeStyle = '#ff7a1a'; g.stroke();
}
function getSprite(p){
  let key, draw;
  if (p.img) {
    if (!p.img.complete || !p.img.naturalWidth) return null;
    key = 'img:' + p.imgKey;
    draw = g => {
      g.beginPath(); g.arc(SPR/2, SPR/2, SPR/2 - 4, 0, Math.PI*2); g.fillStyle = '#000'; g.fill();
      g.save(); g.clip(); g.drawImage(p.img, 0, 0, SPR, SPR); g.restore();
      ring(g);
    };
  } else {
    key = 'emo:' + p.t;
    draw = g => {
      g.beginPath(); g.arc(SPR/2, SPR/2, SPR/2 - 4, 0, Math.PI*2); g.fillStyle = '#000'; g.fill();
      g.font = `${Math.round(SPR*0.6)}px "Apple Color Emoji","Segoe UI Emoji",system-ui,sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(p.t, SPR/2, SPR/2 + 4);
      ring(g);
    };
  }
  if (!SPRITES.has(key)) {
    const c = document.createElement('canvas');
    c.width = c.height = SPR;
    draw(c.getContext('2d'));
    SPRITES.set(key, c);
  }
  return SPRITES.get(key);
}

function drawFloats(){
  for (let i = floats.length - 1; i >= 0; i--) {
    const p = floats[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g;
    p.life -= p.g ? 0.02 : 0.011;
    if (p.life <= 0) { floats.splice(i, 1); continue; }
    const sp = getSprite(p);
    if (!sp) continue;
    const c = Math.cos(p.rot), s = Math.sin(p.rot);
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.setTransform(DPR*c, DPR*s, -DPR*s, DPR*c, p.x*DPR, p.y*DPR);
    ctx.drawImage(sp, -p.d/2, -p.d/2, p.d, p.d);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
}

function readAudio(t){
  if (S.demo) {
    const k = t / 1000;
    for (let i = 0; i < freq.length; i++) {
      const base = Math.max(0, 1 - i / 60);
      const pulse = 0.5 + 0.5 * Math.sin(k * 4);
      freq[i] = Math.min(255, base * (180 + 60 * Math.sin(k * 2 + i * 0.1)) * pulse + Math.random() * 25 * (1 - i / freq.length));
    }
    for (let i = 0; i < wave.length; i++) wave[i] = 128 + Math.sin(i * 0.05 + k * 6) * 40 * (0.5 + 0.5 * Math.sin(k * 3));
  } else {
    analyser.getByteFrequencyData(freq);
    analyser.getByteTimeDomainData(wave);
  }
}

function feats(){
  const n = freq.length, b1 = Math.floor(n * 0.06), m1 = Math.floor(n * 0.3);
  let b = 0, m = 0, h = 0, a = 0;
  for (let i = 0; i < n; i++) {
    const v = freq[i] / 255; a += v;
    if (i < b1) b += v; else if (i < m1) m += v; else h += v;
  }
  return { bass: b / b1, mid: m / (m1 - b1), treble: h / (n - m1), vol: a / n };
}

function updateBeat(f, now){
  hist.push(f.bass); if (hist.length > 40) hist.shift();
  const avg = hist.reduce((x,y) => x + y, 0) / hist.length;
  if (now - lastBeat > 250 && f.bass > avg * 1.35 + 0.04 && f.bass > 0.15) {
    beatLevel = 1; lastBeat = now;
    rainItem();
  }
  beatLevel *= 0.88;
}

function drawSpectrum(){
  const bars = 64, bw = W / bars, n = freq.length;
  for (let i = 0; i < bars; i++) {
    const start = Math.floor(Math.pow(n, i / bars));
    const end = Math.max(start + 1, Math.floor(Math.pow(n, (i + 1) / bars)));
    let sum = 0;
    for (let j = start; j < end && j < n; j++) sum += freq[j];
    const v = (sum / (end - start)) / 255 * S.sens;
    const h = Math.min(v, 1.2) * H * 0.8;
    ctx.fillStyle = `hsl(${S.hue},100%,${35 + v * 40}%)`;
    ctx.fillRect(i * bw + 1, H - h, bw - 2, h);
  }
}

function drawCircle(f){
  const cx = W / 2, cy = H / 2, base = Math.min(W, H) * 0.15, n = freq.length;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const v = freq[i % n] / 255 * S.sens;
    const a = i / n * Math.PI * 2 - Math.PI / 2;
    const r = base * (1 + f.bass * S.sens * 0.8 + v * 0.8);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = `hsl(${S.hue},100%,${55 + beatLevel * 25}%)`;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, base * (0.6 + beatLevel * 0.2), 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,255,${0.1 + beatLevel * 0.3})`;
  ctx.fill();
}

function drawWave(f){
  const n = wave.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = i / n * W;
    const y = H / 2 + (wave[i] - 128) / 128 * S.sens * H * 0.4;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.lineJoin = 'round';
  ctx.lineWidth = 2 + f.vol * 12 * S.sens;
  ctx.strokeStyle = `hsl(${S.hue},100%,${55 + f.treble * 40}%)`;
  ctx.stroke();
}

function drawParticles(f){
  const spawn = Math.floor(f.vol * 12 * S.sens + beatLevel * 20);
  for (let i = 0; i < spawn; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 4) * (0.5 + f.bass * S.sens);
    parts.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, h: S.hue + Math.random() * 30 - 15 });
  }
  if (parts.length > 1200) parts.splice(0, parts.length - 1200);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vx *= 1.01; p.vy *= 1.01; p.life -= 0.008;
    if (p.life <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) { parts.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${p.h},100%,60%,${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2 + f.bass * 6 * S.sens, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTunnel(f){
  phase += 0.01 + f.mid * 0.05 * S.sens;
  const cx = W / 2, cy = H / 2, rings = 14, maxR = Math.max(W, H) * 0.9;
  for (let i = 0; i < rings; i++) {
    const k = (i / rings + phase) % 1;
    const r = Math.pow(k, 2.2) * maxR;
    const v = freq[Math.floor(i / rings * freq.length * 0.5)] / 255 * S.sens;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `hsl(${S.hue + i * 6},100%,${45 + v * 35 + beatLevel * 20}%)`;
    ctx.lineWidth = 2 + v * 12 + beatLevel * 8;
    ctx.stroke();
  }
}

const DRAW = [drawSpectrum, drawCircle, drawWave, drawParticles, drawTunnel];

function loop(now){
  requestAnimationFrame(loop);
  readAudio(now);
  const f = feats();
  updateBeat(f, now);
  if (S.auto && now - autoTimer > 12000) { S.mode = (S.mode + 1) % NAMES.length; autoTimer = now; updateButtons(); }
  ctx.fillStyle = `rgba(0,0,0,${1 - S.trail})`;
  ctx.fillRect(0, 0, W, H);
  DRAW[S.mode](f);
  if (beatLevel > 0.6) {
    ctx.fillStyle = `hsla(${S.hue},100%,50%,${(beatLevel - 0.6) * 0.2})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawFloats();
}

async function startApp(demo){
  const err = document.getElementById('err');
  err.textContent = '';
  if (!started) {
    if (demo) {
      S.demo = true;
    } else {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        err.textContent = 'Deze browser ondersteunt geen microfoon. Gebruik de demo of Chrome.';
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
        });
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') await ac.resume();
        analyser = ac.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.6;
        ac.createMediaStreamSource(stream).connect(analyser);
        freq = new Uint8Array(analyser.frequencyBinCount);
        wave = new Uint8Array(analyser.fftSize);
      } catch (e) {
        err.textContent = 'Microfoon kan niet worden geopend (' + e.name + '). Op een telefoon werkt de microfoon alleen via de https-link van de app. Start anders de demo.';
        return;
      }
    }
    started = true;
    buildModeButtons();
    autoTimer = performance.now();
  }
  document.getElementById('start').classList.add('gone');
  if (!running) { running = true; requestAnimationFrame(loop); }
}
</script>
